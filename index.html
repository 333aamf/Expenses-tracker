
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Expense Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-12">
  <div class="max-w-md mx-auto p-4 space-y-6">
    
    <header class="flex justify-between items-center bg-indigo-600 text-white p-4 rounded-2xl shadow-md">
      <div>
        <h1 class="text-xl font-bold">Daily Expenses</h1>
        <p class="text-xs text-indigo-200">Local Offline Storage</p>
      </div>
      <div class="text-right">
        <span class="text-xs uppercase tracking-wider text-indigo-200 block">Total</span>
        <span id="total-amount" class="text-2xl font-black">$0.00</span>
      </div>
    </header>

    <form id="expense-form" class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">DESCRIPTION</label>
        <input type="text" id="desc" placeholder="Groceries, coffee, fuel..." required 
               class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">AMOUNT</label>
          <input type="number" step="0.01" id="amount" placeholder="0.00" required 
                 class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">CATEGORY</label>
          <select id="category" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm shadow transition">
        Add Expense
      </button>
    </form>

    <div class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">History</h2>
        <button id="clear-btn" class="text-xs text-rose-500 hover:underline">Clear All</button>
      </div>
      <ul id="expense-list" class="space-y-2"></ul>
    </div>

  </div>

  <script>
    // LocalStorage Key
    const STORAGE_KEY = 'pwa_local_expenses_v1';
    let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const form = document.getElementById('expense-form');
    const descInput = document.getElementById('desc');
    const amountInput = document.getElementById('amount');
    const categoryInput = document.getElementById('category');
    const list = document.getElementById('expense-list');
    const totalEl = document.getElementById('total-amount');
    const clearBtn = document.getElementById('clear-btn');

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      render();
    }

    function render() {
      list.innerHTML = '';
      let total = 0;

      if (expenses.length === 0) {
        list.innerHTML = `<li class="text-center py-6 text-slate-400 text-xs">No expenses recorded yet.</li>`;
        totalEl.textContent = '$0.00';
        return;
      }

      expenses.forEach((item, index) => {
        total += parseFloat(item.amount);
        const li = document.createElement('li');
        li.className = 'bg-white p-3 rounded-xl shadow-sm flex justify-between items-center text-sm';
        li.innerHTML = `
          <div>
            <div class="font-medium text-slate-800">${escapeHtml(item.desc)}</div>
            <div class="text-xs text-slate-400">${item.category} • ${item.date}</div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-semibold text-slate-700">$${parseFloat(item.amount).toFixed(2)}</span>
            <button onclick="deleteExpense(${index})" class="text-slate-300 hover:text-rose-500 transition">
              &times;
            </button>
          </div>
        `;
        list.appendChild(li);
      });

      totalEl.textContent = `$${total.toFixed(2)}`;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const newExpense = {
        desc: descInput.value,
        amount: amountInput.value,
        category: categoryInput.value,
        date: new Date().toLocaleDateString()
      };
      expenses.unshift(newExpense);
      saveAndRender();
      form.reset();
    });

    function deleteExpense(index) {
      expenses.splice(index, 1);
      saveAndRender();
    }

    clearBtn.addEventListener('click', () => {
      if (confirm('Clear all stored expenses?')) {
        expenses = [];
        saveAndRender();
      }
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // Register Service Worker for PWA / offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    render();
  </script>
</body>
</html>
